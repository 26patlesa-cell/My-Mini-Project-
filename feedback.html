<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORME. – Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="brand" href="index.html"><b>FORME.</b><small>Wear your perspective</small></a>
    <nav class="site-nav"><a href="index.html">Home</a><a href="trends.html">Trends</a><a href="collections.html">Collections</a><a href="outfit-ideas.html">Outfit Ideas</a><a href="style-guide.html">Style Guide</a><a href="feedback.html" class=active>Feedback</a></nav>
  </header>

  <main>
    <span class="eyebrow">Your voice shapes the next edit</span>
    <h1 class="display">Tell us what you think.</h1>
    <p class="lead-sub">Good style is a conversation. Tell us what you want to see next.</p>
    <div class="row g-5 align-items-center">
      <div class="col-lg-7">
        <form class="form-card" action="#" method="get">
          <label for="name">Your name</label>
          <input class="field" type="text" id="name" name="name" required>
          <label for="email">Email address</label>
          <input class="field" type="email" id="email" name="email" required>
          <label for="msg">What would you love to see?</label>
          <textarea class="field" id="msg" name="message" rows="5"></textarea>
          <button class="btn-forme" type="submit">Send feedback &nearrow;</button>
        </form>
      </div>
      <div class="col-lg-5">
        <h2 class="thanks">Thank you for being part of the story.</h2>
        <span class="thanks-sub">Forme is better with you in it.</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
